<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="jspdf.umd.min.js"></script>
    <style>
        body {
            width: 400px;
            padding: 20px;
            font-family: Arial, sans-serif;
            margin: 0;
        }
        h2 {
            margin: 0 0 15px 0;
            font-size: 18px;
            color: #333;
        }
        .section {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        .section:last-of-type {
            border-bottom: none;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        input[type="number"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .radio-group {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }
        .radio-option {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .radio-option input[type="radio"] {
            margin: 0;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        #defineZoneBtn {
            background-color: #2196F3;
        }
        #defineZoneBtn:hover {
            background-color: #1976D2;
        }
        #startBtn {
            background-color: #4CAF50;
        }
        #startBtn:hover {
            background-color: #45a049;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #zoneStatus {
            padding: 8px;
            background-color: #e8f5e9;
            border-left: 4px solid #4CAF50;
            border-radius: 4px;
            font-size: 12px;
            margin-bottom: 10px;
            color: #2e7d32;
        }
        #zoneStatus.not-defined {
            background-color: #fff3e0;
            border-left-color: #ff9800;
            color: #e65100;
        }
        #status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
            font-size: 14px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
        }
        .info {
            background-color: #d1ecf1;
            color: #0c5460;
        }
    </style>
</head>
<body>
<h2>📸 Screenshot to PDF</h2>

<div class="section">
    <label>Orientation du PDF :</label>
    <div class="radio-group">
        <div class="radio-option">
            <input type="radio" id="landscape" name="orientation" value="landscape" checked>
            <label for="landscape" style="margin: 0; font-weight: normal;">🖼️ Paysage</label>
        </div>
        <div class="radio-option">
            <input type="radio" id="portrait" name="orientation" value="portrait">
            <label for="portrait" style="margin: 0; font-weight: normal;">📱 Portrait</label>
        </div>
    </div>
</div>

<div class="section">
    <label>Zone de capture :</label>
    <div id="zoneStatus" class="not-defined">
        ⚠️ Plein écran (non définie)
    </div>
    <div class="zone-buttons">
        <button id="defineZoneBtn">🎯 Définir la zone</button>
        <button id="resetZoneBtn" style="display: none;">🗑️ Réinitialiser</button>
    </div>
</div>

<div class="section">
    <label for="count">Nombre de captures :</label>
    <input type="number" id="count" min="1" max="200" value="5">

    <label for="delay">Délai entre captures (ms) :</label>
    <input type="number" id="delay" min="100" max="5000" value="1500" step="100">
</div>

<button id="startBtn">🚀 Démarrer la capture</button>

<div id="status" style="display: none;"></div>

<script src="popup.js"></script>
</body>
</html>
