<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="jspdf.umd.min.js"></script>
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    h2 {
      margin: 0 0 15px 0;
      font-size: 18px;
      color: #333;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #555;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }
    button:hover {
      background-color: #45a049;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    #status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 4px;
      text-align: center;
      font-size: 14px;
    }
    .success {
      background-color: #d4edda;
      color: #155724;
    }
    .error {
      background-color: #f8d7da;
      color: #721c24;
    }
    .info {
      background-color: #d1ecf1;
      color: #0c5460;
    }
  </style>
</head>
<body>
  <h2>📸 Screenshot to PDF</h2>
  
  <label for="count">Nombre de captures :</label>
  <input type="number" id="count" min="1" max="200" value="5">
  
  <label for="delay">Délai entre captures (ms) :</label>
  <input type="number" id="delay" min="100" max="5000" value="1500" step="100">
  
  <button id="startBtn">🚀 Démarrer</button>
  
  <div id="status" style="display: none;"></div>

  <script src="popup.js"></script>
</body>
</html>
